[package]
edition = "2024"
name = "passport-desktop"
version = "1.0.6"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.11.0", default-features = false, features = [
    "napi4",
    "napi6",
    "tokio_rt",
    "deferred_trace"
] }
napi-derive = "3.6.0"
tokio = "1.53.1"
futures = "0.3.33"

[target.'cfg(windows)'.dependencies]
widestring = "1.2.1"
windows = { version = "0.62.2", features = [
    "Foundation",
    "Security_Credentials_UI",
    "Security_Cryptography",
    "Security_Cryptography_Core",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_System_WinRT",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
pollster = "1.0.1"
[build-dependencies]
napi-build = "2.3.2"

[profile.release]
lto = true
